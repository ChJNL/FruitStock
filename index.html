<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍇 프리미엄 과일 주식 시뮬레이터</title>

  <!-- 브랜드 로고용 디스플레이 폰트 + 가격/타이머용 모노스페이스 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-shell">

    <!-- ============================================
         상단 바: 로고 + 오늘이 며칠째인지 뱃지
    ============================================ -->
    <header class="top-bar">
      <div class="brand">
        <p class="brand-eyebrow">PREMIUM FRUIT EXCHANGE</p>
        <h1>🍇 프리미엄 과일 주식 시뮬레이터</h1>
      </div>
      <div class="day-badge">
        <span class="day-label">DAY</span>
        <span class="day-number mono" id="dayNumber">1</span>
      </div>
    </header>

    <!-- ============================================
         타이머 바: 다음 정산(하루 종료)까지 남은 시간
    ============================================ -->
    <section class="timer-section">
      <div class="timer-labels">
        <span>다음 정산까지</span>
        <span class="mono" id="timerText">05:00</span>
      </div>
      <div class="timer-track">
        <div class="timer-fill" id="timerFill"></div>
      </div>
    </section>

    <!-- ============================================
         오늘의 뉴스 패널 (하루가 바뀔 때마다 갱신되고,
         토스트처럼 잠깐 뜨는 게 아니라 계속 보여줍니다)
    ============================================ -->
    <section class="news-panel" id="newsPanel">
      <span class="news-icon">📰</span>
      <div>
        <p class="news-label">오늘의 뉴스</p>
        <p class="news-text" id="newsText">첫째 날 시장이 개장했습니다. 행운을 빌어요!</p>
      </div>
    </section>

    <main class="main-grid">

      <!-- ============================================
           왼쪽 사이드 컬럼: 내 자산 + 정보상
      ============================================ -->
      <aside class="side-col">

        <div class="panel wallet-panel">
          <h2>💰 내 자산</h2>

          <div class="stat-row">
            <span class="stat-label">보유 현금</span>
            <span class="stat-value mono" id="cashValue">0원</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">평가 총자산</span>
            <span class="stat-value mono gold-text" id="totalValue">0원</span>
          </div>

          <hr class="divider">

          <h3>보유 종목</h3>
          <ul class="holdings-list" id="holdingsList">
            <!-- script.js가 자동 생성 -->
          </ul>
        </div>

        <div class="panel informant-panel">
          <h2>🕵️ 어둠의 정보상</h2>
          <p class="informant-desc">
            돈을 내면 오늘 밤 터질 뉴스에 대한 흐릿한 힌트를 얻을 수 있다는 소문이...
          </p>
          <p class="hint-text" id="hintText">"아직 정보를 사지 않았어요..."</p>
          <button class="btn hint-btn" id="hintBtn">정보 구매 (500원)</button>
        </div>

      </aside>

      <!-- ============================================
           오른쪽: 실시간 시세판 (표 형태의 HTS 스타일)
      ============================================ -->
      <section class="panel table-panel">
        <h2>📈 실시간 시세</h2>
        <div class="table-scroll">
          <table class="stock-table">
            <thead>
              <tr>
                <th>종목</th>
                <th>구분</th>
                <th>현재가</th>
                <th>등락</th>
                <th>보유</th>
                <th>거래</th>
              </tr>
            </thead>
            <tbody id="stockTableBody">
              <!-- script.js가 fruits 배열을 기반으로 6개 행을 자동 생성 -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

    <footer class="app-footer">
      <p>새로고침해도 자산은 그대로 저장돼요 (localStorage)</p>
      <button class="reset-btn" id="resetBtn">게임 초기화</button>
    </footer>

  </div>

  <!-- JS는 항상 body 맨 아래에서 불러옵니다 (DOM이 먼저 준비되어야 하므로) -->
  <script src="script.js"></script>
</body>
</html>
